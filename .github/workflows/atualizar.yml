name: Atualizar Ranking de Clubes

on:
  schedule:
    # Ranking de Clubes oficial: só às segundas, depois dos campeonatos do fim de semana
    # (10:17 de Brasília = 13:17 UTC). Durante a semana, a coluna "Provável posição
    # amanhã" do site mostra a projeção com os pontos ao vivo.
    - cron: "17 13 * * 1"
  workflow_dispatch:
  push:
    # também roda quando este arquivo muda (faz o GitHub registrar o workflow)
    paths:
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write

concurrency:
  group: atualizar-clubes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Coletar e calcular
        run: python scripts/atualizar.py --perfis 300
      - name: Publicar dados
        run: |
          git config user.name "tm-clubes bot"
          git config user.email "actions@users.noreply.github.com"
          git add dados/publico
          if git diff --cached --quiet; then
            echo "sem mudanças"
          else
            git commit -m "Atualiza dados do Ranking de Clubes ($(date -u +%Y-%m-%d))"
            git push
          fi
